name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: End-to-end scan against the practice lab
        run: |
          python lab/practice_lab.py &
          sleep 2
          python recon_pilot.py 127.0.0.1 -p 2100-9000 --no-color -o notes.md
          grep -q "CVE-2011-2523" notes.md
